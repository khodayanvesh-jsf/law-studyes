name: Build Offline Law Studyes APK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * 0' # Weekly Sunday 2:30 AM IST fresh offline APK build

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & Scrape All Live LL.B. Notes
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scrape_nyayasaral.py

      - name: Setup Node.js & Java 17
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Capacitor Android APK (Full Offline Data Bundled)
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../LawStudyes-Offline.apk

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LawStudyes-Offline-APK
          path: LawStudyes-Offline.apk
