name: Law Studyes Daily Auto-Sync

on:
  schedule:
    - cron: '30 20 * * *' # Runs daily at 2:00 AM IST
  workflow_dispatch:       # Also lets you trigger manually anytime

permissions:
  contents: write

jobs:
  sync-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scrape_nyayasaral.py
      - name: Commit updated database and notes
        run: |
          git config user.name "Law Studyes Auto-Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git add www/nyayasaral_db.json nyayasaral_notes.sqlite notes_markdown/
          git diff --staged --quiet || git commit -m "Auto-sync latest LL.B. notes"
          git push
